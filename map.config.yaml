# ─────────────────────────────────────────────────────────────────────
# map.config.yaml  —  généré depuis www/style.json  par retro_style.py
#
# Champs disponibles par couche :
#   label          nom lisible
#   color          couleur principale (fill ou line)
#   border_color   couleur du contour (buildings...)
#   visible        false pour masquer la couche
#   extrusion_3d   true pour activer le rendu 3D buildings
#   appear_at      zoom minimum d'apparition
#   labels_at      zoom minimum des étiquettes (défaut: appear_at+3)
#   opacity        opacité globale (0.0–1.0)
#   tiles          paramètres PMTiles (min_zoom, max_zoom, simplification,
#                  detail_from pour buildings)
#   sports         leisure uniquement : rendu des terrains par sport_render
#                  (markings_at, default, values: couleur, contour, longueur)
#
# Champs disponibles par sous-type :
#   tag            tag OSM du filtre (landuse, leisure, natural, highway...)
#   color          couleur principale
#   color_private  couleur si access=private
#   pattern        fill-pattern (ex: military-hatch)
#   pattern_private  fill-pattern uniquement si access=private (ex: green-hatch)
#   outline_color  couleur du contour
#   appear_at      zoom minimum
#   opacity        opacité fill (0.0–1.0)
#   pattern_at     zoom d'apparition du motif (défaut: appear_at)
#   by             clé OSM secondaire (ex: religion, leaf_type)
#   by_color       couleur par valeur de la clé "by" (défaut: color)
#   by_pattern     motif par valeur de la clé "by" (défaut: pattern)
#   tunnel_color   couleur des tronçons en tunnel (défaut: color éclaircie)
#
# Section patterns : motifs SVG chargés par la carte
#   file, size (px), replace (substitution de couleurs dans le SVG)
#
# Modifier CE fichier, pas style.json directement.
# Regénérer :  python3 build_map.py
# ─────────────────────────────────────────────────────────────────────

map:
  name: Map
  version: "1.0.0"
  center: [4.3517, 50.8503]
  zoom: 13
  background: "#f2efe9"
  font: "#734a08"
  glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf"


patterns:
  grave_yard_christian: { file: assets/patterns/grave_yard_christian.svg, size: 32 }
  grave_yard_generic: { file: assets/patterns/grave_yard_generic.svg, size: 32 }
  grave_yard_jewish: { file: assets/patterns/grave_yard_jewish.svg, size: 32 }
  grave_yard_muslim: { file: assets/patterns/grave_yard_muslim.svg, size: 32 }
  green-hatch: { file: assets/military_hatch.svg, size: 20, replace: { "#bd4a72": "#a9ccac" } }
  military-hatch: { file: assets/military_hatch.svg, size: 20 }

layers:

  landuse:
    label: Occupation du sol
    color: "#e0dfdf"
    appear_at: 10
    subtypes:
      allotments: { tag: landuse, color: "#9cad95", opacity: 0.9 }
      brownfield: { tag: landuse, color: "#b3a392", opacity: 0.5 }
      cemetery: { tag: landuse, color: "#aacbaf", pattern: grave_yard_generic, pattern_at: 13, by: religion, by_pattern: { christian: grave_yard_christian, jewish: grave_yard_jewish, muslim: grave_yard_muslim } }
      commercial: { tag: landuse, color: "#f2dad9" }
      construction: { tag: landuse, color: "#b3a392", opacity: 0.95 }
      depot: { tag: landuse, color: "#ebdbe8" }
      education: { tag: landuse, color: "#ffe894" }
      farmland: { tag: landuse, color: "#add15a", opacity: 0.95 }
      farmyard: { tag: landuse, color: "#f0d3ad", opacity: 0.95 }
      garages: { tag: landuse, color: "#dfddce" }
      greenfield: { tag: landuse, color: "#cfeca8", opacity: 0.5 }
      industrial: { tag: landuse, color: "#ebdbe8" }
      landfill: { tag: landuse, color: "#b3a392", opacity: 0.5 }
      military: { tag: landuse, color: "#bd4a72", pattern: military-hatch, opacity: 0.1 }
      quarry: { tag: landuse, color: "#c5c3c3", outline_color: "#b0aeae" }
      railway: { tag: landuse, color: "#ebdbe8" }
      recreation_ground: { tag: landuse, color: "#c8facc" }
      religious: { tag: landuse, color: "#d0d0d0", outline_color: "#919191" }
      residential: { tag: landuse }
      retail: { tag: landuse, color: "#ffd6d1" }
      village_green: { tag: landuse, color: "#cdebb0" }

  water:
    label: Eau
    color: "#aad3df"
    appear_at: 10
    subtypes:
      canal: { tag: waterway }
      ditch: { tag: waterway, appear_at: 14 }
      river: { tag: waterway }
      stream: { tag: waterway, appear_at: 13 }
      wetland: { tag: natural, color: "#d4e2c6", opacity: 0.5 }

  green:
    label: Espaces verts
    color: "#add19e"
    appear_at: 10
    subtypes:
      flowerbed: { tag: landuse, color: "#e6f2c1", color_private: "#f3f9e0" }
      forest: { tag: landuse, color_private: "#d9ecd2" }
      garden: { tag: leisure, color: "#cfeca8", color_private: "#a4c775", pattern_private: green-hatch }
      grass: { tag: landuse, color: "#cdebb0", color_private: "#eaf6df" }
      grassland: { tag: natural, color: "#cdebb0", color_private: "#eaf6df" }
      heath: { tag: natural, color: "#d6d99f" }
      meadow: { tag: landuse, color: "#cdebb0", color_private: "#eaf6df" }
      park: { tag: leisure, color: "#a9ccac", color_private: "#94b597", pattern_private: green-hatch }
      scrub: { tag: natural, color: "#d6e6b8", opacity: 0.9 }
      shrubbery: { tag: natural, color: "#6b9943", color_private: "#8cb36d", opacity: 0.5 }
      wood: { tag: natural, color_private: "#d9ecd2" }

  trees:
    label: Arbres et haies
    color: "#6ba048"
    appear_at: 14
    labels_at: 16
    subtypes:
      hedge: { tag: barrier, color: "#6ba048", opacity: 0.85 }
      tree: { tag: natural, color: "#7eb36a", appear_at: 17, by: leaf_type, by_color: { broadleaved: "#6cae50", needleleaved: "#5f9f50" } }
      tree_row: { tag: natural, color: "#8fbc77", appear_at: 16, opacity: 0.55 }

  buildings:
    label: Bâtiments
    color: "#fce1c5"
    border_color: "#d4a574"
    extrusion_3d: true
    appear_at: 13

  leisure:
    label: Loisirs
    color: "#def3c0"
    appear_at: 10
    labels_at: 15
    subtypes:
      dog_park: { tag: leisure }
      fitness_station: { tag: leisure }
      outdoor_seating: { tag: leisure, color: "#e6e1d9" }
      pitch: { tag: leisure, color: "#6fb792", outline_color: "#6fb792" }
      playground: { tag: leisure, color: "#c2e1c2" }
    sports:
      markings_at: 17
      default: { color: "#8ad3af", outline_color: "#6fb792", length: 50 }
      values:
        basketball: { color: "#c47a4a", outline_color: "#9e5e33", length: 28 }
        boules: { color: "#c4a86a", outline_color: "#9e8a4e", length: 15 }
        soccer: { color: "#5a9e4b", outline_color: "#3d7a32", length: 105 }
        tennis: { color: "#4a7c3f", outline_color: "#3a6530", length: 24 }

  roads:
    label: Routes
    appear_at: 10
    labels_at: 15
    subtypes:
      motorway:       { tag: highway, color: "#e892a2", outline_color: "#dc2a67", appear_at: 10 }
      motorway_link:  { tag: highway, color: "#e892a2", outline_color: "#dc2a67", appear_at: 12 }
      trunk:          { tag: highway, color: "#f9b29c", outline_color: "#c84e2f", appear_at: 10 }
      trunk_link:     { tag: highway, color: "#f9b29c", outline_color: "#c84e2f", appear_at: 12 }
      primary:        { tag: highway, color: "#fcd6a4", outline_color: "#a06b00", appear_at: 10 }
      primary_link:   { tag: highway, color: "#fcd6a4", outline_color: "#a06b00", appear_at: 12 }
      secondary:      { tag: highway, color: "#f7fabf", outline_color: "#707d05", appear_at: 10 }
      secondary_link: { tag: highway, color: "#f7fabf", outline_color: "#707d05", appear_at: 13 }
      tertiary:       { tag: highway, color: "#ffffff", outline_color: "#8f8f8f", appear_at: 11 }
      tertiary_link:  { tag: highway, color: "#ffffff", outline_color: "#8f8f8f", appear_at: 13 }
      residential:    { tag: highway, color: "#ffffff", outline_color: "#bbbbbb", appear_at: 12 }
      unclassified:   { tag: highway, color: "#ffffff", outline_color: "#bbbbbb", appear_at: 12 }
      living_street:  { tag: highway, color: "#ededed", outline_color: "#c6c6c6", appear_at: 13 }
      service:        { tag: highway, color: "#ffffff", outline_color: "#bbbbbb", appear_at: 14 }
      busway:         { tag: highway, color: "#ffffff", outline_color: "#bbbbbb", appear_at: 13 }
      track:          { tag: highway, color: "#996600", appear_at: 13 }

  pedestrian:
    label: Piétons
    color: "#999"
    appear_at: 13
    subtypes:
      footway: { tag: highway, color: "#fa8072", outline_color: "#ffffff", appear_at: 14 }
      path: { tag: highway, color: "#fa8072", outline_color: "#ffffff", appear_at: 14 }
      pedestrian: { tag: highway, color: "#ededed" }
      steps: { tag: highway, color: "#97644c", appear_at: 14 }

  cycleway:
    label: Cyclable
    color: "#0000ff"
    appear_at: 12

  railway:
    label: Ferroviaire
    color: "#c0c0c0"
    appear_at: 10
    subtypes:
      miniature: { tag: railway, color: "#999999", appear_at: 14 }
      rail: { tag: railway, color: "#787878", tunnel_color: "#c0c0c0", appear_at: 13 }
      subway: { tag: railway, color: "#999999", tunnel_color: "#b0b0b0", appear_at: 12 }
      tram: { tag: railway, color: "#444444", tunnel_color: "#b0b0b0", appear_at: 13 }

  public_transport:
    label: Transport STIB
    color: "#ffffff"
    appear_at: 10

  boundaries:
    label: Limites administratives
    color: "#ac46ac"
    appear_at: 10

  poi:
    label: POI
    color: "#734a08"
    appear_at: 14
    labels_at: 15


  street_furniture:
    label: Mobilier urbain
    color: "#555555"
    appear_at: 17
    subtypes:
      # amenity
      bench: { tag: amenity }
      lounger: { tag: amenity }
      waste_basket: { tag: amenity }
      vending_machine: { tag: amenity }
      # barrier
      bollard: { tag: barrier }
      gate: { tag: barrier }
      bus_trap: { tag: barrier }
      cycle_barrier: { tag: barrier }
      lift_gate: { tag: barrier }
      planter: { tag: barrier }
      fence: { tag: barrier, color: "#9c9c9c" }
      # highway
      street_lamp: { tag: highway }
      # entrance=* : rendu uniforme par clé (toute valeur), cf.
      # build_map.py — door=* affine seulement l'icône (comme
      # cuisine=*/religion=* pour les POI), pas une couche à part.
      entrance: { tag: entrance }
