# ─────────────────────────────────────────────────────────────────────
# map.config.yaml  —  généré depuis www/style.json  par retro_style.py
#
# Champs disponibles par couche :
#   label          nom lisible
#   color          couleur principale (fill ou line)
#   border_color   couleur du contour (buildings...)
#   visible        false pour masquer la couche
#   extrusion_3d   true pour activer le rendu 3D buildings
#   appear_at      zoom minimum d'apparition
#   labels_at      zoom minimum des étiquettes (défaut: appear_at+3)
#   opacity        opacité globale (0.0–1.0)
#
# Champs disponibles par sous-type :
#   tag            tag OSM du filtre (landuse, leisure, natural, highway...)
#   color          couleur principale
#   color_private  couleur si access=private
#   pattern        fill-pattern (ex: military-hatch)
#   pattern_private  fill-pattern uniquement si access=private (ex: green-hatch)
#   outline_color  couleur du contour
#   appear_at      zoom minimum
#   opacity        opacité fill (0.0–1.0)
#
# Modifier CE fichier, pas style.json directement.
# Regénérer :  python3 build_map.py
# ─────────────────────────────────────────────────────────────────────

map:
  name: Map
  center: [4.3517, 50.8503]
  zoom: 13
  background: "#f2efe9"
  font: "#734a08"
  glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf"


layers:

  landuse:
    label: Occupation du sol
    color: "#e0dfdf"
    appear_at: 10
    subtypes:
      allotments: { tag: landuse, color: "#9cad95", opacity: 0.9 }
      brownfield: { tag: landuse, color: "#b3a392", opacity: 0.5 }
      cemetery: { tag: landuse, color: "#576e5a", opacity: 0.9 }
      commercial: { tag: landuse, color: "#f2dad9" }
      construction: { tag: landuse, color: "#b3a392", opacity: 0.95 }
      # depot : pas de rendu dédié dans osm-carto -> on reprend la teinte
      # "industriel" déjà utilisée pour railway/industrial (dépôts STIB/SNCB)
      depot: { tag: landuse, color: "#ebdbe8" }
      education: { tag: landuse, color: "#ffe894" }
      farmland: { tag: landuse, color: "#add15a", opacity: 0.95 }
      farmyard: { tag: landuse, color: "#f0d3ad", opacity: 0.95 }
      # garages : couleur osm-carto @garages
      garages: { tag: landuse, color: "#dfddce" }
      greenfield: { tag: landuse, color: "#cfeca8", opacity: 0.5 }
      industrial: { tag: landuse, color: "#ebdbe8" }
      landfill: { tag: landuse, color: "#b3a392", opacity: 0.5 }
      military: { tag: landuse, color: "#bd4a72", pattern: military-hatch, opacity: 0.1 }
      # quarry : couleur osm-carto @quarry + contour (darken 10%)
      quarry: { tag: landuse, color: "#c5c3c3", outline_color: "#b0aeae" }
      railway: { tag: landuse, color: "#ebdbe8" }
      # recreation_ground : osm-carto le rend comme @leisure (vert clair
      # proche de @park) -> teinte "loisirs" claire
      recreation_ground: { tag: landuse, color: "#c8facc" }
      # religious : couleur osm-carto @place_of_worship + contour (darken 30%)
      religious: { tag: landuse, color: "#d0d0d0", outline_color: "#919191" }
      residential: { tag: landuse }
      retail: { tag: landuse, color: "#ffd6d1" }
      # village_green : osm-carto le rend comme @grass -> même teinte que
      # green-grass dans cette app
      village_green: { tag: landuse, color: "#cdebb0" }

  water:
    label: Eau
    color: "#aad3df"
    appear_at: 10
    subtypes:
      canal: { tag: waterway }
      ditch: { tag: waterway, appear_at: 14 }
      river: { tag: waterway }
      stream: { tag: waterway, appear_at: 13 }
      wetland: { tag: natural, color: "#d4e2c6", opacity: 0.5 }

  green:
    label: Espaces verts
    color: "#add19e"
    appear_at: 10
    subtypes:
      flowerbed: { tag: landuse, color: "#e6f2c1", color_private: "#f3f9e0" }
      forest: { tag: landuse, color_private: "#d9ecd2" }
      garden: { tag: leisure, color: "#cfeca8", color_private: "#a4c775", pattern_private: green-hatch }
      grass: { tag: landuse, color: "#cdebb0", color_private: "#eaf6df" }
      meadow: { tag: landuse, color: "#cdebb0", color_private: "#eaf6df" }
      park: { tag: leisure, color: "#a9ccac", color_private: "#94b597", pattern_private: green-hatch }
      scrub: { tag: natural, color: "#d6e6b8", opacity: 0.9 }
      shrubbery: { tag: natural, color: "#6b9943", color_private: "#8cb36d", opacity: 0.5 }
      wood: { tag: natural, color_private: "#d9ecd2" }

  trees:
    label: Arbres et haies
    color: "#6ba048"
    appear_at: 14
    labels_at: 16
    subtypes:
      hedge: { tag: barrier, opacity: 0.85 }
      tree: { tag: natural, appear_at: 17 }
      tree_row: { tag: natural, color: "#8fbc77", appear_at: 16, opacity: 0.55 }

  buildings:
    label: Bâtiments
    color: "#fce1c5"
    border_color: "#d4a574"
    extrusion_3d: true
    appear_at: 13

  leisure:
    label: Loisirs
    color: "#def3c0"
    appear_at: 10
    labels_at: 15
    subtypes:
      dog_park: { tag: leisure }
      fitness_station: { tag: leisure }
      outdoor_seating: { tag: leisure, color: "#e6e1d9" }
      pitch: { tag: leisure, color: "#6fb792", outline_color: "#6fb792" }
      playground: { tag: leisure, color: "#c2e1c2" }

  roads:
    label: Routes
    color: "#adadad"
    border_color: "#ffc0cb"
    appear_at: 10
    labels_at: 15
    subtypes:
      busway: { tag: highway, color: "#add19e", appear_at: 12, opacity: 0.5 }
      living_street: { tag: highway, color: "#ffffff", appear_at: 13, opacity: 0.5 }
      motorway: { tag: highway, color: "#e990a0", opacity: 0.5 }
      motorway_link: { tag: highway, color: "#e990a0", appear_at: 12 }
      primary: { tag: highway, color: "#fcd6a4", appear_at: 15, opacity: 0.5 }
      primary_link: { tag: highway, color: "#fcd6a4", appear_at: 13, opacity: 0.5 }
      residential: { tag: highway, color: "#ffffff", appear_at: 15, opacity: 0.5 }
      secondary: { tag: highway, color: "#f7fabf", appear_at: 15, opacity: 0.5 }
      secondary_link: { tag: highway, color: "#f7fabf", appear_at: 14, opacity: 0.5 }
      service: { tag: highway, color: "#ffffff", appear_at: 13, opacity: 0.5 }
      tertiary: { tag: highway, color: "#ffffff", appear_at: 15, opacity: 0.5 }
      tertiary_link: { tag: highway, color: "#ffffff", appear_at: 14, opacity: 0.5 }
      track: { tag: highway, color: "#996633", appear_at: 13, opacity: 0.5 }
      trunk: { tag: highway, color: "#f9b29c", opacity: 0.5 }
      trunk_link: { tag: highway, color: "#f9b29c", appear_at: 12, opacity: 0.5 }
      unclassified: { tag: highway, color: "#ffffff", appear_at: 13, opacity: 0.5 }

  pedestrian:
    label: Piétons
    color: "#999"
    appear_at: 13
    subtypes:
      footway: { tag: highway, color: "#97644c", appear_at: 14 }
      path: { tag: highway, color: "#97644c", appear_at: 14 }
      pedestrian: { tag: highway, color: "#ededed" }
      steps: { tag: highway, color: "#97644c", appear_at: 14 }

  cycleway:
    label: Cyclable
    color: "#0000ff"
    appear_at: 12

  railway:
    label: Ferroviaire
    color: "#c0c0c0"
    appear_at: 10
    subtypes:
      miniature: { tag: railway, color: "#999999", appear_at: 14 }
      rail: { tag: railway, color: "#787878", appear_at: 13, opacity: 0.15 }
      subway: { tag: railway, color: "#999999", appear_at: 12, opacity: 0.15 }
      tram: { tag: railway, color: "#444444", appear_at: 13, opacity: 0.15 }

  public_transport:
    label: Transport STIB
    color: "#ffffff"
    appear_at: 10

  boundaries:
    label: Limites administratives
    color: "#ac46ac"
    appear_at: 10

  poi:
    label: POI
    color: "#734a08"
    appear_at: 14
    labels_at: 15
