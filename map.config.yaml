map:
  name: Map
  center: [4.3517, 50.8503]
  zoom: 13
  background: "#f2efe9"
  font: "#734a08"
  glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf"


layers:

  landuse:
    label: Occupation du sol
    color: "#e0dfdf"
    appear_at: 10
    subtypes:
      allotments: { tag: landuse, color: "#9cad95" }
      brownfield: { tag: landuse, color: "#b3a392" }
      cemetery: { tag: landuse, color: "#576e5a" }
      commercial: { tag: landuse, color: "#f2dad9" }
      construction: { tag: landuse, color: "#b3a392" }
      education: { tag: landuse, color: "#ffe894" }
      farmland: { tag: landuse, color: "#add15a" }
      farmyard: { tag: landuse, color: "#f0d3ad" }
      greenfield: { tag: landuse, color: "#cfeca8" }
      industrial: { tag: landuse, color: "#ebdbe8" }
      landfill: { tag: landuse, color: "#b3a392" }
      military: { tag: landuse, color: "#bd4a72" }
      railway: { tag: landuse, color: "#ebdbe8" }
      residential: { tag: landuse }
      retail: { tag: landuse, color: "#ffd6d1" }

  water:
    label: Eau
    color: "#aad3df"
    appear_at: 10
    subtypes:
      canal: { tag: waterway }
      ditch: { tag: waterway, appear_at: 14 }
      river: { tag: waterway }
      stream: { tag: waterway, appear_at: 13 }
      wetland: { tag: natural, color: "#d4e2c6" }

  green:
    label: Espaces verts
    color: "#add19e"
    appear_at: 10
    subtypes:
      flowerbed: { tag: landuse, color: "#e6f2c1" }
      forest: { tag: landuse }
      garden: { tag: leisure, color: "#cfeca8" }
      grass: { tag: landuse, color: "#cdebb0" }
      meadow: { tag: landuse, color: "#cdebb0" }
      park: { tag: leisure, color: "#a9ccac" }
      scrub: { tag: natural, color: "#d6e6b8" }
      shrubbery: { tag: natural, color: "#6b9943" }
      wood: { tag: natural }

  trees:
    label: Arbres et haies
    color: "#6ba048"
    appear_at: 14
    subtypes:
      hedge: { tag: barrier }
      tree: { tag: natural, color: "#7eb36a", appear_at: 17 }
      tree_row: { tag: natural, color: "#7eb36a", appear_at: 16 }

  buildings:
    label: Bâtiments
    color: "#fce1c5"
    appear_at: 13

  leisure:
    label: Loisirs
    color: "#def3c0"
    appear_at: 10
    subtypes:
      pitch: { tag: leisure, color: "#6fb792", appear_at: 17 }

  roads:
    label: Routes
    color: "#bbb"
    appear_at: 10
    subtypes:
      busway: { tag: highway, color: "#add19e", appear_at: 12 }
      living_street: { tag: highway, color: "#ffffff", appear_at: 13 }
      motorway: { tag: highway, color: "#e990a0" }
      motorway_link: { tag: highway, color: "#e990a0", appear_at: 12 }
      primary: { tag: highway, color: "#333", appear_at: 15 }
      primary_link: { tag: highway, color: "#fcd6a4", appear_at: 13 }
      residential: { tag: highway, color: "#333", appear_at: 15 }
      secondary: { tag: highway, color: "#333", appear_at: 15 }
      secondary_link: { tag: highway, color: "#f7fabf", appear_at: 14 }
      service: { tag: highway, color: "#ffffff", appear_at: 13 }
      tertiary: { tag: highway, color: "#333", appear_at: 15 }
      tertiary_link: { tag: highway, color: "#ffffff", appear_at: 14 }
      track: { tag: highway, color: "#996633", appear_at: 13 }
      trunk: { tag: highway, color: "#f9b29c" }
      trunk_link: { tag: highway, color: "#f9b29c", appear_at: 12 }
      unclassified: { tag: highway, color: "#ffffff", appear_at: 13 }

  pedestrian:
    label: Piétons
    color: "#999"
    appear_at: 13
    subtypes:
      footway: { tag: highway, color: "#97644c", appear_at: 14 }
      path: { tag: highway, color: "#97644c", appear_at: 14 }
      pedestrian: { tag: highway, color: "#ededed" }
      steps: { tag: highway, color: "#97644c", appear_at: 14 }

  cycleway:
    label: Cyclable
    color: "#0000ff"
    appear_at: 12

  railway:
    label: Ferroviaire
    color: "#c0c0c0"
    appear_at: 10
    subtypes:
      miniature: { tag: railway, color: "#999999", appear_at: 14 }
      rail: { tag: railway, color: "#787878", appear_at: 13 }
      subway: { tag: railway, color: "#999999", appear_at: 12 }
      tram: { tag: railway, color: "#444444", appear_at: 13 }

  public_transport:
    label: Transport STIB
    color: "#ffffff"
    appear_at: 10

  boundaries:
    label: Limites administratives
    color: "#ac46ac"
    appear_at: 10

  poi:
    label: POI
    color: "#734a08"
    appear_at: 14
